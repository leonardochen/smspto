name: Build Docker image

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  deploy:
    name: Restart production deployment
    if: github.ref_name == 'main'
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Restart deployment
        env:
          K8S_RESTART_TOKEN: ${{ secrets.K8S_RESTART_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer ${K8S_RESTART_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"name":"web","namespace":"smspto","resource_type":"deployment"}' \
            https://kubes1-restart.somagroup.com.br/restart
